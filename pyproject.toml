[project]
name = "pybr"
version = "1.0.0"
description = "Collection of utilities for Brazilian data and formats"
authors = [
    { name = "Gustavo Efeiche", email = "gustavo.efeiche@gmail.com" }
]
license = "GPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/effeix/pybr"
repository = "https://github.com/effeix/pybr"
keywords = ["brazil", "portuguese", "utilities", "cpf", "cnpj"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

requires-python = ">=3.10"
dependencies = [
    "pytest>=8.4.2",
]

[project.scripts]
pybr = "pybr:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
